coverage:
  scope: Кассовые операции, инкассация, хранение, помещения и ограниченный набор требований ИБ; не полный свод законодательства.
  new_type_policy: Новый type_code требует явного rule_id и проверки условий; добавление в каталог не реализует
    распознавание видео.
  not_video_provable:
  - Бухгалтерские проводки, недостача или сумма ущерба без учетных данных
  - Умысел, виновность, мошенничество и иная уголовная квалификация
  - Принадлежность учетной записи, полномочия, внутренние разрешения без дополнительных сведений
  - Подлинность банкноты по общему ракурсу
  - Состояние замка, пломбы или реквизита, скрытых камерой
  excluded_claims:
  - Свет или счетная машина оставлены включенными сами по себе
  - Отсутствие просмотра обеих сторон удостоверения как самостоятельное нарушение
  - Любой открытый сейф или дверь без контекста
  - Безусловный запрет любого телефона без проверки исключений и характеристик
  class_taxonomy: Сохранены V1–V14 и V1b; только кандидаты правил, а не автоматические юридические выводы.
classifications:
  V1:
    name: Возможное отсутствие идентификации
    type_code: ID
    candidate_rule_ids:
    - CASH_ID_IN
    - CASH_ID_OUT
    status: conditional
    conditions:
    - Установить прием или выдачу наличных и применимую процедуру.
    - Проверить весь эпизод, ранее выполненную идентификацию и цифровые документы.
    limitations: Отсутствие бумажного удостоверения в кадре недостаточно; лица не распознавать.
  V1b:
    name: Возможное несоответствие процедуры идентификации
    type_code: THIRD
    candidate_rule_ids:
    - CASH_ID_IN
    - CASH_ID_OUT
    status: conditional
    conditions:
    - Подтвердить, чья идентификация требуется и какие действия выполнены, без распознавания лиц.
    limitations: Передача документа другим человеком не устанавливает его владельца или отсутствие законного представительства.
  V2:
    name: Деньги предыдущей операции вне хранения
    type_code: TABLE
    candidate_rule_ids:
    - CASH_STORAGE
    status: conditional
    conditions:
    - Проследить деньги завершенной операции и отличить их от денег текущего клиента.
    limitations: Совместная видимость нескольких пачек не доказывает смешивание клиентов.
  V3:
    name: Принятые наличные оставлены вне устройства хранения
    type_code: TABLE
    candidate_rule_ids:
    - CASH_STORAGE
    status: conditional
    conditions:
    - Подтвердить завершение операции и статус денег как ранее принятых; видны место хранения и уход.
    limitations: Не подменять хранением текущую рабочую обработку денег; сам уход не подтверждает все условия.
  V4:
    name: Возможное несоблюдение хранения в кассовом устройстве
    type_code: SAFE
    candidate_rule_ids:
    - CASH_STORAGE
    status: conditional
    conditions:
    - Различить устройство на рабочем месте и кладовую/сейфовую комнату; установить хранение ранее принятых денег.
    limitations: Открытие для операции допустимо; состояние замка нельзя угадать. Пункты о кладовой не применять
      автоматически к ящику кассира.
  V5:
    name: Возможное нарушение обращения с ключами
    type_code: KEYS
    candidate_rule_ids:
    - CASH_KEYS
    status: conditional
    conditions:
    - Установить назначение ключа, ответственного и применимый порядок хранения.
    limitations: Не считать любой похожий предмет ключом; требования к кладовой и кассовому устройству различаются.
  V6:
    name: Прием или пересчет без присутствия клиента
    type_code: INCOMPLETE
    candidate_rule_ids:
    - CASH_PRESENT
    status: conditional
    conditions:
    - Подтвердить прием/пересчет именно денег клиента и фактический уход до завершения.
    limitations: Отличать от внутреннего пересчета и отсутствия клиента только в ракурсе камеры.
  V7:
    name: Уход до окончания обслуживания
    type_code: LEAVE
    candidate_rule_ids:
    - CASH_LEAVE
    status: conditional
    conditions:
    - Подтвердить фактический уход с рабочего места при незавершенном обслуживании того же клиента.
    limitations: Вставание, движение внутри места или уход после завершения не достаточны.
  V8:
    name: Хранение личных вещей в кассовом узле
    type_code: PERSONAL
    candidate_rule_ids:
    - CASH_PERSONAL
    status: conditional
    conditions:
    - Подтвердить личную принадлежность, хранение и нахождение в кассовом узле.
    limitations: Учитывать лекарства, медицинские изделия и разрешенные средства связи без фото-/видеофиксации;
      функции устройства не угадывать.
  V9:
    name: Возможное отсутствие пересчета или несоответствие оборудования
    type_code: NOCOUNT
    candidate_rule_ids:
    - CASH_COUNT
    - CASH_EQUIPMENT
    status: conditional
    conditions:
    - Раздельно проверить полный процесс приема банкнот и технические требования к оборудованию.
    limitations: Отсутствие видимой машины не равно отсутствию пересчета; характеристики оборудования требуют внешних
      сведений.
  V10:
    name: Возможное несоблюдение обращения с сомнительными банкнотами
    type_code: REJECT
    candidate_rule_ids:
    - CASH_SUSPECT
    status: conditional
    conditions:
    - Независимо подтвердить статус сомнительных банкнот и проследить их дальнейшую обработку.
    limitations: Отбраковка машиной не равна сомнительности или подделке; не утверждать неисполнение экспертизы
      по короткому эпизоду.
  V11:
    name: Возможное несоответствие входа кассы
    type_code: DOOR
    candidate_rule_ids:
    - PREMISES_ACCESS
    status: conditional
    conditions:
    - Подтвердить назначение помещения и входа, условия изоляции и доступа.
    limitations: Норма об оборудовании запираемой дверью не означает запрета любого открытия; п. 16 до 01.01.2027
      действует во временной редакции.
  V12:
    name: Частичный возврат наличных — наблюдение для проверки
    type_code: CASH_RETURN
    candidate_rule_ids: []
    status: observation_only
    conditions:
    - Установить вид операции, ее стадию и причину возврата; запросить недостающие сведения.
    limitations: Возврат части суммы сам по себе не запрещен указанными общими процедурами. Не назначать закон по
      формуле «не соответствует ни приему, ни выдаче». Не формировать нарушение только из этой метки.
  V13:
    name: Оставленные документы или предметы
    type_code: UNATTENDED_ITEMS
    candidate_rule_ids:
    - CASH_KEYS
    - IS_PAPER_PROTECTION
    status: conditional
    conditions:
    - 'Подтвердить конкретную природу предмета: ключи/регулируемые ценности или бумага с защищаемыми данными; проверить
      банковский порядок.'
    limitations: Любая сумка, журнал или лист не являются автоматически регулируемыми ценностями. Для бумаги нужен
      информационный контекст.
  V14:
    name: Возможное отсутствие завершения или блокировки сеанса
    type_code: EXIT
    candidate_rule_ids:
    - IS_SESSION_TIMEOUT
    status: records_required
    conditions:
    - Подтвердить более 30 минут неактивности и отсутствие как завершения сеанса, так и блокировки.
    - Проверить применимость пункта 71 и исключения пункта 72 с использованием сведений системы.
    limitations: Короткий уход и включенный экран недостаточны. Не утверждать нарушение неизвестного внутреннего
      регламента.
