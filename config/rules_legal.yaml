rules:
  CASH_ID_IN:
    document: Постановление Правления НБРК от 29.11.2019 № 231 — Правила осуществления кассовых операций и операций
      по инкассации банкнот, монет и ценностей
    punkt: 19 пп. 1)
    rule_text: 'Возможное основание; применимость требует проверки. При приеме наличных предусмотрена визуальная
      идентификация по удостоверению личности либо данным сервиса цифровых документов. Ограничения: Отсутствие бумажного
      документа в кадре не доказывает отсутствие идентификации; распознавание лиц не используется.'
    url: https://adilet.zan.kz/rus/docs/V1900019680
    required_observations:
    - Наблюдается прием наличных; видна полная последовательность обслуживания.
    - Проверено, что идентификация не выполнена ранее или через цифровые документы.
    limitations: Отсутствие бумажного документа в кадре не доказывает отсутствие идентификации; распознавание лиц
      не используется.
    verified_on: '2026-10-18'
    review_status: source_checked_team_review_required
    source_id: NBRK_231
    evidence_mode: video_and_context
  CASH_ID_OUT:
    document: Постановление Правления НБРК от 29.11.2019 № 231 — Правила осуществления кассовых операций и операций
      по инкассации банкнот, монет и ценностей
    punkt: 31 пп. 1)
    rule_text: 'Возможное основание; применимость требует проверки. При выдаче наличных предусмотрена идентификация
      по данным документа либо сервиса цифровых документов. Ограничения: Не определять личность и принадлежность
      документа по лицам; отсутствие видимого документа недостаточно.'
    url: https://adilet.zan.kz/rus/docs/V1900019680
    required_observations:
    - Достоверно установлен контекст выдачи наличных и доступен полный эпизод.
    limitations: Не определять личность и принадлежность документа по лицам; отсутствие видимого документа недостаточно.
    verified_on: '2026-10-18'
    review_status: source_checked_team_review_required
    source_id: NBRK_231
    evidence_mode: video_and_context
  CASH_STORAGE:
    document: Постановление Правления НБРК от 29.11.2019 № 231 — Правила осуществления кассовых операций и операций
      по инкассации банкнот, монет и ценностей
    punkt: '20'
    rule_text: 'Возможное основание; применимость требует проверки. Ранее принятые наличные хранятся в предназначенных
      для этого устройствах, закрывающихся на ключ. Ограничения: Деньги текущего клиента во время операции и краткое
      открытие устройства для работы сами по себе не означают нарушение; состояние замка нельзя угадывать.'
    url: https://adilet.zan.kz/rus/docs/V1900019680
    required_observations:
    - Прослеживается принадлежность денег завершенной операции.
    - Видно, где деньги остаются после ее завершения.
    limitations: Деньги текущего клиента во время операции и краткое открытие устройства для работы сами по себе
      не означают нарушение; состояние замка нельзя угадывать.
    verified_on: '2026-10-18'
    review_status: source_checked_team_review_required
    source_id: NBRK_231
    evidence_mode: video_and_context
  CASH_PRESENT:
    document: Постановление Правления НБРК от 29.11.2019 № 231 — Правила осуществления кассовых операций и операций
      по инкассации банкнот, монет и ценностей
    punkt: 20, абз. 1
    rule_text: 'Возможное основание; применимость требует проверки. Прием и пересчет наличных выполняются в присутствии
      клиента. Ограничения: Нужно различать прием, выдачу и последующий внутренний пересчет; отсутствие клиента
      в ограниченном ракурсе не доказывает его уход.'
    url: https://adilet.zan.kz/rus/docs/V1900019680
    required_observations:
    - Виден прием или пересчет и уход клиента до его завершения.
    limitations: Нужно различать прием, выдачу и последующий внутренний пересчет; отсутствие клиента в ограниченном
      ракурсе не доказывает его уход.
    verified_on: '2026-10-18'
    review_status: source_checked_team_review_required
    source_id: NBRK_231
    evidence_mode: video_and_context
  CASH_COUNT:
    document: Постановление Правления НБРК от 29.11.2019 № 231 — Правила осуществления кассовых операций и операций
      по инкассации банкнот, монет и ценностей
    punkt: 19 пп. 2)
    rule_text: 'Возможное основание; применимость требует проверки. При приеме банкнот предусмотрен полистный пересчет
      и проверка подлинности и платежности. Ограничения: Не требуется именно ручной пересчет; работа машины и предшествующие
      действия могут быть вне видимости.'
